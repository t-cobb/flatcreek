<script>
const __src = "\nasync function dsLoad(name, path, deps) {\n  deps = deps || {};\n  const res = await fetch(path);\n  let src = await res.text();\n  src = src.replace(/^import[^\\n]*\\n/gm, '');\n  src = src.replace('export function', 'function');\n  const compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;\n  const argNames = Object.keys(deps);\n  const argVals = Object.values(deps);\n  const fn = new Function('React', 'useState', 'useRef', 'useEffect', ...argNames, compiled + '\\nreturn ' + name + ';');\n  window.DS = window.DS || {};\n  window.DS[name] = fn(React, React.useState, React.useRef, React.useEffect, ...argVals);\n}\n\nasync function boot() {\n  await dsLoad('OfficialBanner', '../components/navigation/OfficialBanner.jsx');\n  await dsLoad('Button', '../components/core/Button.jsx');\n  await dsLoad('Header', '../components/navigation/Header.jsx', { Button: window.DS.Button });\n  await dsLoad('Footer', '../components/navigation/Footer.jsx');\n  await dsLoad('PlaceholderNote', '../components/feedback/PlaceholderNote.jsx');\n  await dsLoad('FlowLine', '../components/core/FlowLine.jsx');\n  const { OfficialBanner, Header, Footer, PlaceholderNote, FlowLine } = window.DS;\n\n  const PROJECT_LINKS = [\n    { label: 'Thaw wells', href: 'thaw-wells.html' },\n    { label: 'Bank restoration', href: 'bank-restoration.html' },\n    { label: 'Scott Lane', href: 'scott-lane.html' },\n    { label: 'Ongoing projects', href: 'ongoing-projects.html' },\n  ];\n\n  function ProjectRail({ current }) {\n    return (\n      <nav className=\"fc-project-rail\" style={{ position: 'sticky', top: 'var(--space-8)', flexShrink: 0, width: '200px', display: 'flex', flexDirection: 'column', gap: 'var(--space-1)', borderLeft: '1px solid var(--color-border)', paddingLeft: 'var(--space-4)' }}>\n        <a href=\"../projects.html\" style={{ fontSize: 'var(--text-xs)', fontWeight: 'var(--weight-medium)', color: 'var(--color-text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 'var(--space-2)', textDecoration: 'none' }}>&larr; All projects</a>\n        {PROJECT_LINKS.map(l => (\n          <a key={l.href} href={l.href} className=\"rail-link\" style={{ fontSize: 'var(--text-sm)', fontWeight: l.label === current ? 'var(--weight-medium)' : 'normal', color: l.label === current ? 'var(--color-primary)' : 'var(--color-text)', textDecoration: 'none', padding: 'var(--space-2) 0' }}>{l.label}</a>\n        ))}\n      </nav>\n    );\n  }\n\n  function Page() {\n    const h3 = { fontFamily: 'var(--font-display)', fontSize: 'var(--text-xl)', marginTop: 'var(--space-7)', marginBottom: 'var(--space-3)' };\n    const p = { fontFamily: 'var(--font-body)', fontSize: 'var(--text-base)', lineHeight: 'var(--leading-relaxed)', color: 'var(--color-text)', marginBottom: 'var(--space-4)' };\n    const ul = { fontFamily: 'var(--font-body)', fontSize: 'var(--text-base)', lineHeight: 'var(--leading-relaxed)', color: 'var(--color-text)', margin: '0 0 var(--space-4)', paddingLeft: 'var(--space-6)', display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' };\n    return (\n      <div>\n        <OfficialBanner />\n        <Header homeHref=\"../index.html\" links={[\n            { label: 'About', href: '../about.html' },\n            { label: 'Projects', href: '../projects.html', subLinks: [\n              { label: 'Thaw wells', href: 'thaw-wells.html' },\n              { label: 'Bank restoration', href: 'bank-restoration.html' },\n              { label: 'Scott Lane', href: 'scott-lane.html' },\n              { label: 'Ongoing projects', href: 'ongoing-projects.html' },\n            ] },\n            { label: 'Research Archive', href: '../research-archive.html' },\n            { label: 'Contact', href: '../contact.html' },\n          ]} />\n        <section style={{ position: 'relative', width: '100%', height: '42vh', minHeight: '320px', overflow: 'hidden' }}>\n          <img src=\"../assets/photography/thaw-well-5-outfall-flowing.jpeg\" alt=\"Warm groundwater discharging from a thaw well into Flat Creek\" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />\n          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(0deg, oklch(15% 0.02 235 / 0.75) 0%, oklch(16% 0.02 235 / 0.15) 55%, transparent 80%)' }} />\n          <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: 'var(--space-8)', maxWidth: '900px' }}>\n            <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 600, color: 'var(--water-300)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 'var(--space-2)' }}>FCWID Project</div>\n            <h1 style={{ color: '#fff', fontSize: 'var(--text-5xl)' }}>The Flat Creek Thaw Wells Program</h1>\n          </div>\n        </section>\n        <div className=\"fc-project-layout\" style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: 'var(--space-10) var(--space-6) var(--space-16)', display: 'flex', gap: 'var(--space-10)', alignItems: 'flex-start' }}>\n          <ProjectRail current=\"Thaw wells\" />\n          <section style={{ flex: 1, minWidth: 0, maxWidth: '700px' }}>\n            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-lg)', color: 'var(--color-text-muted)', lineHeight: 'var(--leading-normal)', marginBottom: 'var(--space-6)' }}>\n              Over 40 years and almost $2.5 million, six wells now protect the district's full reach of Flat Creek from ice-jam flooding. Here's how the program came to be.\n            </p>\n            <h3 style={h3}>Overview</h3>\n            <p style={p}>The Flat Creek Thaw Wells Program is a project that has taken over 40 years and almost $2.5 million in expenditures to realize. It has taken the contributions of a wide spectrum of design professionals, academicians, and lay persons to bring to fruition, that fruition being the protection of hundreds of millions of dollars worth of private property (primarily residences) and public infrastructure (sanitary sewer, water, storm drainage, wastewater treatment, and streets and pathways). In the process, it has advanced knowledge in the area of ice formation in cold weather creeks and the means by which that formation may be interrupted and neutralized by the use of dedicated thaw wells.</p>\n\n            <h3 style={h3}>The Phenomenon</h3>\n            <p style={p}>The freezing of Flat Creek from its bottom up (through the formation of first frazzle ice and then anchor ice that adheres to the bottom of the creek bed and builds up from there, thereby forcing the water in the creek up and out of its banks) and the subsequent jamming of the creek with ice with resultant flooding of adjacent properties throughout much of the reach of Flat Creek as it courses through the town of Jackson is a phenomenon of long standing. It is particularly pronounced from Karns Meadow downstream to where the creek exits the town at High School Road. It actually also takes place downstream of that point as well. Old timers tell of the days (the 1960s and 1970s) during certain winters when they would lace up ice skates and skate from the Rodeo Grounds at what was then the west end of town (today Flat Creek Lane) all the way down the valley to what is today Rafter J Subdivision.</p>\n            <p style={p}>The occurrence of the creek freezing and causing flooding to adjacent properties was not a significant issue until it began to conflict with development as the town grew westward. And then, from the 1980s on, it was an issue. In hindsight it's easy to question why development was allowed to take place in those areas that are impacted by creek freezing-induced flooding, but that is an academic exercise at this point. We're not going back to the pre-development days in west Jackson.</p>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/flat-creek-ice-phenomenon.jpg\" alt=\"Flat Creek freezing over in winter\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Flat Creek icing over — the process that, left unchecked, jams the channel and forces water out over its banks.</figcaption>\n            </figure>\n\n            <h3 style={h3}>The Birth of a Concept</h3>\n            <p style={p}>Addressing the issue by sending heavy equipment into Flat Creek to remove accumulated ice began in the 1980s. It was expensive, time and labor intensive, and potentially damaging to the riparian corridor and the aquatic species within it. Surely there had to be a better way.</p>\n            <p style={p}>In 1987, Mike Yokel Jr., then the long-term Public Works Director for the Town, hit upon a \u201cseat-of-the-pants\u201d or \u201chorse sense\u201d idea of how the issue might be addressed and put it to the test. His straightforward idea was to pump water from Drinking Water Well No. 5, located in Karns Meadow and not utilized in the winter due to insufficient demand (the tourists had gone home), into Flat Creek. As unsophisticated as the idea and its implementation were (the groundwater was pumped out onto the ground and allowed to run into Flat Creek), it proved effective. There was no particular scientific underpinning for what Mike did; it was simply adding warm water (groundwater in Jackson maintains a year-round temperature of approximately 47 degrees Fahrenheit) to cold water to bring up the average temperature. Sophistication would wait for a later day.</p>\n            <p style={p}>The idea worked! However, the beneficial effect of introducing warm water into the creek at Karns Meadow did not extend all the way down the creek to its exit from the town at High School Road. A series of what became known as \u201cthaw wells\u201d located strategically along the creek would be necessary to keep the full reach of the creek from freezing in the winter. And that would involve considerable expense.</p>\n\n            <h3 style={h3}>The First Step</h3>\n            <p style={p}>In the early 1990s, Bob Norton of Nelson Engineering, then the contract Town Engineer for the Town of Jackson, provided the first scientific theoretical justification for why Mike Yokel Jr.'s seat-of-the-pants idea worked. He performed heat and mass transfer calculations that gave the idea a certain \u201cintellectual heft.\u201d Based on this, Mike's demonstration of the effectiveness of the idea, crude though it may have been, and the pressing need for something to be done to address the freezing and flooding issue, a case could be made to the Wyoming Water Development Commission (WWDC) for funding for the envisioned array of thaw wells.</p>\n\n            <h3 style={h3}>Initial Wells, Initial Funding</h3>\n            <p style={p}>In the late 1990s, the Town approached the WWDC with a funding request for three thaw wells (Thaw Wells No. 1, 2, and 3), to be located in Karns Meadow, opposite the downstream end of Garaman Park, and just upstream of High School Road, respectively. No particular science was involved in the proposed well locations. The sites were selected by simple expediency \u2014 each well would be located on property already owned by the Town of Jackson.</p>\n            <p style={p}>It happened that the WWDC was in a very solid position financially at that point in time, and it took a little bit of a gamble on what was admittedly an unusual project. The wells were designed and bid out by Nelson Engineering on behalf of the Town. They were drilled by Thomas Drilling in May of 2000 and put into use the following winter. And, as anticipated and hoped, they worked!</p>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/thaw-well-2-outfall.jpeg\" alt=\"A screened thaw well outfall discharging into Flat Creek\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Thaw Well No. 2, September 2026.</figcaption>\n            </figure>\n\n            <h3 style={h3}>Initial Use</h3>\n            <p style={p}>Yes, the thaw wells worked, but their use needed to be embraced and then optimized. Unfortunately, there was no division within the Town Public Works Department that was directly charged with managing the operation and oversight of the wells. In essence, the wells were orphans. If they were to be managed by the then-current staff of the public works department, the time and resources utilized would have to be siphoned off from other worthy and important initiatives of the department. That was simply untenable.</p>\n            <p style={p}>Reflecting the \u201corphan\u201d status of the wells, their first winter of use involved throwing the \u201con\u201d switch full blast at the start of November and the \u201coff\u201d switch at the end of March. The wells worked, but using them in the way they were used that first winter was not an effective regime, not in terms of energy usage, water usage, nor cost.</p>\n            <p style={p}>In following winters, the Public Works Department took greater \u201cownership\u201d of the well operation regime, but, nonetheless, the regime was haphazard at best. Even so, important lessons were learned, such as the wells don't need to be on all winter, but they do need to be turned on in the very first hours of ice formation. Another was that the existing three wells were not adequate to cover the entire reach of the creek. The impact of Thaw Well No. 1 ran out well upstream of Thaw Well No. 2, and, similarly, the impact of Thaw Well No. 2 ran out well upstream of Thaw Well No. 3. What this translated into was the need to still enter the creek with heavy equipment (hired from the private sector) to remove accumulated ice in those stretches of the creek not covered by the thaw wells. Clearly, additional wells would be necessary. The third lesson was that, really and truly, a better operation regime needed to be implemented. Where that third lesson led was to the formation of the Flat Creek Watershed Improvement District (FCWID).</p>\n\n            <h3 style={h3}>District Formation</h3>\n            <p style={p}>Following the strictures of Wyoming State Statute, a vote of electors drawn from the potential properties to be included within district boundaries was conducted in November of 2014, and the District was formed in early 2015. The District and the Town then entered into a Memorandum of Understanding (MOU) that set the ground rules for how the two entities would interact with each other. This was important, particularly with respect to the operation of the wells. Although the wells were (and are) owned by the town, the district would have responsibility for operating them. The district got right to work by imposing property assessments upon the properties included within the district boundaries (note: all properties in the district abut the creek) to provide working capital and then embarked upon a series of studies to quantify the scope of the creek freezing problem and to develop a thorough and optimized program to fully address it. Until that program was put firmly in place, the district would have to continue with a mixed approach that included the existing three thaw wells and the use of private sector heavy equipment (\u201cyellow iron\u201d) wherever necessary. One significant change to previous operations protocols, however, was that the equipment used would be engaged and paid for by the district.</p>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/thaw-well-5-wellhead-summer.jpeg\" alt=\"Wellhead equipment at a thaw well site\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Wellhead and control equipment at one of the district's thaw well sites.</figcaption>\n            </figure>\n\n            <h3 style={h3}>Study and Analysis</h3>\n            <p style={p}>Beginning in the winter of 2015-16 and extending through the winter of 2020-21, the district engaged Alder Environmental, LLC to daily collect a wide range of data, including water temperature, air temperature, humidity, barometric pressure, solar gain, and creek flow. This information was then transmitted to the team of Professor Edward Kempema at the University of Wyoming and Professor Rob Ettema at Colorado State University, also engaged by the district, for analysis and recommendations. The two professors are acknowledged leaders in the study of water body (lake, creek, and river) freezing phenomena and were genuinely excited by the opportunity to investigate the unique circumstances and conditions applicable to Flat Creek.</p>\n\n            <h3 style={h3}>Recommendations and Implementation</h3>\n            <p style={p}>After carefully examining the data they received, making a number of site visits, and suggesting certain experiments to run (for example, throttling down the flow rate of the discharge water into the creek from the wells as well as the duration of discharge), they came up with a number of conclusions:</p>\n            <ul style={ul}>\n              <li>The critical environmental factors affecting the need for and the efficacy of the use of the thaw wells were air temperature, rising barometric pressure, and solar radiation. The consideration of all other factors unnecessarily complicated matters.</li>\n              <li>The critical calendar interval within which the use of the thaw wells is most important and most likely is from roughly November 10th through February 5th, or roughly 45 days before and after the winter solstice. This happens to be when the shadow of Snow King Mountain falls most heavily on Flat Creek through the district and, thus, reduces solar gain along the creek.</li>\n            </ul>\n            <p style={p}>Their recommendations were:</p>\n            <ul style={ul}>\n              <li><strong>Intermittent use</strong> \u2014 use the wells in a targeted way, introducing groundwater into the creek only when conditions demand it.</li>\n              <li><strong>Efficient use, no. 1</strong> \u2014 use the wells only for a limited length of time each time they are used (6 hours).</li>\n              <li><strong>Efficient use, no. 2</strong> \u2014 use only as much flow as necessary to achieve the desired ends (400 gallons per minute).</li>\n              <li><strong>Radio telemetry</strong> \u2014 use a temperature thermocouple and radio telemetry to monitor the critical operating environmental factor (air temperature) and operate the wells accordingly.</li>\n              <li><strong>Algorithm</strong> \u2014 program the well operation with an algorithm that kicks the wells on when a certain air temperature (below 20 degrees Fahrenheit) is reached and sustained for 24 hours, keeps the wells on for six hours, and then cycles the wells off. Repeat as necessary cycle after cycle all winter long.</li>\n              <li><strong>Online monitoring</strong> \u2014 tie the wells through radio telemetry to an online monitor the district hires (Alder Environmental, LLC), so that the wells are under regular monitoring and control override if necessary. Provide the same monitoring and control override to the Town of Jackson.</li>\n            </ul>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/thaw-well-3-telemetry.jpeg\" alt=\"Radio telemetry and control equipment for a thaw well\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Radio telemetry and control equipment tie each well to the district's online monitoring system.</figcaption>\n            </figure>\n            <p style={p}>The recommendations of Professors Kempema and Ettema were implemented prior to the winter of 2021-22.</p>\n\n            <h3 style={h3}>Additional Thaw Wells</h3>\n            <p style={p}>Thaw Well No. 4, located at Martin Lane in the Jackson Business Park Addition, was drilled and tested in the fall of 2023 and brought on line and integrated into the thaw well system network for the winter of 2023-24.</p>\n            <p style={p}>Thaw Wells No. 5 and 6, located in the Elk Run Townhomes development and the 810 West residential development, respectively, were drilled and tested in the fall of 2025 and brought on line and integrated into the thaw well system network part way into the winter of 2025-26 (January 2026).</p>\n            <p style={p}>With the incorporation of these three new wells, the desired network \u2014 one covering the entire length of the district from below Karns Meadow to High School Road \u2014 is complete.</p>\n\n            <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-6)', margin: 'var(--space-6) 0' }}>\n              <figure style={{ margin: 0 }}>\n                <img src=\"../assets/photography/thaw-well-5-drilling-2.jpeg\" alt=\"Drilling rig at work installing Thaw Well No. 5\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n                <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Drilling Thaw Well No. 5, fall 2025.</figcaption>\n              </figure>\n              <figure style={{ margin: 0 }}>\n                <img src=\"../assets/photography/thaw-well-6-site.jpeg\" alt=\"Landscaped wellhead site for Thaw Well No. 6\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n                <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Thaw Well No. 6, replanted after installation at the 810 West development.</figcaption>\n              </figure>\n            </div>\n\n            <h3 style={h3}>Cost and Funding</h3>\n            <p style={p}>The total direct expenditure over the life of the program, not including the costs of study and analysis (which was on the order of $50,000), was $2,412,981. While that may seem like a lot of money (and it is), it diminishes in comparison to the private property and public infrastructure that it protects (which is on the order of hundreds of millions). The funding sources tapped included:</p>\n            <ul style={ul}>\n              <li>Wyoming Water Development Commission \u2014 $660,000</li>\n              <li>Wyoming Office of Homeland Security (Covid-19 Impact Mitigation Grant) \u2014 $885,079</li>\n              <li>Town of Jackson (Specific Purpose Excise Tax) \u2014 $539,954</li>\n              <li>Teton County Conservation District \u2014 $100,000</li>\n              <li>Flat Creek Watershed Improvement District \u2014 $87,108</li>\n              <li>Wyoming Wildlife Natural Resources Trust \u2014 $75,000</li>\n              <li>Jackson Hole One-Fly \u2014 $45,840</li>\n              <li>Community Foundation of Jackson Hole \u2014 $20,000</li>\n            </ul>\n\n            <h3 style={h3}>Success</h3>\n            <p style={{...p, marginBottom: 0}}>It is fair to say that the thaw wells program is a success. Over the winter of 2025-26, the FCWID did not have to put heavy equipment into the creek even once to remove flood-causing ice. Operating in a cost-effective, efficient, and well-managed way, the program has now achieved the district's desired end.</p>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/thaw-well-5-outfall-flowing.jpeg\" alt=\"Warm groundwater discharging from a thaw well into Flat Creek\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Warm groundwater discharging from Thaw Well No. 5 into Flat Creek.</figcaption>\n            </figure>\n          </section>\n        </div>\n        <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '0 var(--space-6) var(--space-10)' }}><FlowLine static /></div>\n        <Footer />\n      </div>\n    );\n  }\n\n  const root = ReactDOM.createRoot(document.getElementById('root'));\n  root.render(React.createElement(Page));\n}\nboot();\n";
const __compiled = Babel.transform(__src, { presets: [['react', { runtime: 'classic' }]] }).code;
new Function('React','ReactDOM', __compiled)(React, ReactDOM);
</script>
