ucture in the creek and brought in an excavator to rebuild the bank.</p>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/camenzind-bank-restoration-2-construction.jpg\" alt=\"Excavator working along the reshaped bank of Flat Creek next to the homeowner's property\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Bank work under way, March 10, 2025.</figcaption>\n            </figure>\n\n            <p style={p}>By March 11, the reshaped slope was being covered with erosion-control fabric, with rock in place along the water's edge. Construction was complete the following day, March 12.</p>\n\n            <figure style={{ margin: 'var(--space-6) auto', maxWidth: '420px' }}>\n              <img src=\"../assets/photography/camenzind-bank-restoration-3-fabric.jpg\" alt=\"Crew laying erosion-control fabric on the reshaped bank above a rock-lined edge\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Installing erosion-control fabric on the reshaped bank, March 11, 2025.</figcaption>\n            </figure>\n\n            <h3 style={h3}>Results</h3>\n            <p style={p}>By May 1, 2025, new growth was already coming up through the fabric.</p>\n\n            <figure style={{ margin: 'var(--space-6) 0' }}>\n              <img src=\"../assets/photography/camenzind-bank-restoration-4-may.jpg\" alt=\"Newly planted bank above Flat Creek with green growth coming up through the fabric\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Looking downstream, May 1, 2025.</figcaption>\n            </figure>\n\n            <p style={p}>By July 15, the bank was fully established. Where there had been a retreating, eroding edge, there is now a continuous cover of native vegetation between the creek and the property it was threatening.</p>\n\n            <figure style={{ margin: 'var(--space-6) auto', maxWidth: '420px' }}>\n              <img src=\"../assets/photography/camenzind-bank-restoration-5-july.jpg\" alt=\"The restored bank in July 2025, thick with native grasses and vegetation beside Flat Creek\" style={{ width: '100%', borderRadius: 'var(--radius-md)', display: 'block' }} />\n              <figcaption style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--color-text-muted)', marginTop: 'var(--space-2)' }}>Looking downstream, July 15, 2025. The bank is fully established.</figcaption>\n            </figure>\n          </section>\n        </div>\n        <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '0 var(--space-6) var(--space-10)' }}><FlowLine static /></div>\n        <Footer />\n      </div>\n    );\n  }\n\n  const root = ReactDOM.createRoot(document.getElementById('root'));\n  root.render(React.createElement(Page));\n}\nboot();\n";
